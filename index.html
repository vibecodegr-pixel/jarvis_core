<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Core Control Panel</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --panel-bg: #121824;
            --border-color: #1f2d44;
            --accent-cyan: #00e5ff;
            --accent-blue: #0088ff;
            --text-color: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .status-badge {
            background-color: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .config-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .config-title {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        input, textarea, button {
            background-color: #070a10;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        button {
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-blue), #5000ff);
            border: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .editor-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            font-family: 'Consolas', 'Fira Code', monospace;
            min-height: 300px;
            resize: vertical;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--text-color);
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>JARVIS // Core Control</h1>
            <div class="status-badge">SYSTEM ACTIVE</div>
        </header>

        <section class="config-box">
            <h3 class="config-title">System Konfiguration</h3>
            <div class="grid-2">
                <input type="password" id="githubToken" placeholder="GitHub Personal Access Token..." oninput="localStorage.setItem('jarvis_github_token', this.value.trim())">
                <input type="text" id="githubRepo" placeholder="GitHub Repository (z.B. user/repo)..." oninput="localStorage.setItem('jarvis_github_repo', this.value.trim())">
            </div>
            <div class="grid-2">
                <input type="text" id="filePath" placeholder="Dateipfad (z.B. instructions.md)..." oninput="localStorage.setItem('jarvis_file_path', this.value.trim())">
                <input type="text" id="ntfyTopic" placeholder="ntfy.sh Thema (z.B. jarvis-status-GR-998877)..." oninput="localStorage.setItem('jarvis_ntfy_topic', this.value.trim())">
            </div>
        </section>

        <main class="editor-box">
            <h3 class="config-title">File Editor</h3>
            <textarea id="fileContent" placeholder="Lade eine Datei oder schreibe hier Code/Inhalt hinein..."></textarea>
            <div class="button-group">
                <button onclick="loadFile()" class="btn-secondary" style="flex: 1;">Datei Laden</button>
                <button onclick="saveFile()" style="flex: 2;">Datei Speichern (Commit)</button>
            </div>
        </main>
    </div>

    <script>
        // Initialisierung beim Laden
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('githubToken').value = localStorage.getItem('jarvis_github_token') || '';
            document.getElementById('githubRepo').value = localStorage.getItem('jarvis_github_repo') || '';
            document.getElementById('filePath').value = localStorage.getItem('jarvis_file_path') || 'instructions.md';
            document.getElementById('ntfyTopic').value = localStorage.getItem('jarvis_ntfy_topic') || '';
        });

        // Ntfy Push-Benachrichtigung senden
        async function sendNtfyNotification(text) {
            let topic = document.getElementById('ntfyTopic').value.trim();
            if (!topic) return;
            try {
                await fetch(`https://ntfy.sh/${topic}`, { method: 'POST', body: text, mode: 'no-cors' });
            } catch (e) { 
                console.error("Ntfy Fehler:", e); 
            }
        }

        // Hilfsfunktion zum Abrufen des SHAs der Datei auf GitHub
        async function getFileSha(repo, path, token) {
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            try {
                const res = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.sha;
                }
            } catch (e) {
                console.error("Fehler beim Abrufen der SHA:", e);
            }
            return null;
        }

        // Datei von GitHub laden
        async function loadFile() {
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const path = document.getElementById('filePath').value.trim();

            if (!token || !repo || !path) {
                alert("Bitte Token, Repository und Dateipfad ausfüllen!");
                return;
            }

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            try {
                const res = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    // Base64 decodieren (berücksichtigt UTF-8 Zeichen)
                    const content = decodeURIComponent(escape(atob(data.content)));
                    document.getElementById('fileContent').value = content;
                    alert("Datei erfolgreich geladen!");
                } else {
                    const err = await res.json();
                    alert("Fehler beim Laden: " + err.message);
                }
            } catch (e) {
                alert("Fehler beim Laden: " + e.message);
            }
        }

        // Datei auf GitHub speichern (githubUpdateFile)
        async function saveFile() {
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const path = document.getElementById('filePath').value.trim();
            const content = document.getElementById('fileContent').value;

            if (!token || !repo || !path) {
                alert("Bitte Token, Repository und Dateipfad ausfüllen!");
                return;
            }

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            
            try {
                const sha = await getFileSha(repo, path, token);
                const body = {
                    message: `chore: update ${path} via JARVIS Dashboard`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: sha || undefined
                };

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (putRes.ok) {
                    alert("Datei erfolgreich auf GitHub gespeichert!");
                    await sendNtfyNotification(`🚀 JARVIS Update erfolgreich: ${path}`);
                } else {
                    const err = await putRes.json();
                    alert("Speichern fehlgeschlagen: " + err.message);
                }
            } catch (e) {
                alert("Netzwerkfehler beim Speichern: " + e.message);
            }
        }
    </script>
</body>
</html>
