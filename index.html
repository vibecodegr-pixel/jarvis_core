<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Cloud Control</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --success: #238636;
            --danger: #da3633;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 1rem 1.5rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 700; color: var(--accent); letter-spacing: 1px; font-size: 1.1rem; }
        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            background: var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .status-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        
        .progress-bar-container {
            width: 100%;
            height: 3px;
            background: transparent;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.4s ease;
        }
        .progress-bar.loading {
            width: 100%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.85rem 1.1rem;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background-color: var(--accent-hover);
            color: #fff;
        }
        .message.assistant {
            align-self: flex-start;
            background-color: var(--surface);
            border: 1px solid var(--border);
        }
        .diff-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
            padding: 0.35rem 0.7rem;
            background: #1f2428;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .diff-badge:hover { background: var(--accent-hover); color: #fff; }

        footer {
            padding: 1rem 1.5rem;
            background-color: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        /* Modal für Diff-Inspektion */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .modal-body {
            padding: 1rem;
            overflow-y: auto;
            font-family: monospace;
            background: #090c10;
            color: #d2a8ff;
            white-space: pre;
            font-size: 0.85rem;
        }
        .modal-footer {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo">JARVIS // CLOUD CONTROL</div>
        <div class="status-badge">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Bereit</span>
        </div>
    </header>
    
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="chat-container"></div>

    <footer>
        <input type="text" id="prompt-input" placeholder="Aufgabe für JARVIS eingeben..." autocomplete="off" />
        <button id="send-btn" onclick="sendTask()">Senden</button>
    </footer>

    <!-- Diff-Modal -->
    <div class="modal-overlay" id="diff-modal">
        <div class="modal">
            <div class="modal-header">
                <span>Δ Code-Diff Bestätigung (Tool-Authoring)</span>
                <button onclick="closeModal()" style="padding: 0.2rem 0.5rem; background: transparent; color: var(--text);">✕</button>
            </div>
            <div class="modal-body" id="diff-content"></div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="closeModal()">Verwerfen</button>
                <button class="btn-success" onclick="confirmDiff()">Δ Bestätigen & Ausführen</button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURATION ---
        // Bitte passe deine Repository-Daten hier an:
        const CONFIG = {
            owner: "DEIN_GITHUB_USER",
            repo: "DEIN_REPO_NAME",
            pat: localStorage.getItem("JARVIS_PAT") || "", // Wird lokal gespeichert
            memoryUrl: "memory.json"
        };

        let currentDiff = "";
        let isWorking = false;
        let pollInterval = null;
        let workStartTime = 0;

        // --- INIT & PERSISTENZ ---
        window.addEventListener("DOMContentLoaded", () => {
            if (!CONFIG.pat) {
                const token = prompt("Bitte GitHub PAT (mit repo-Rechten) eingeben:");
                if (token) {
                    localStorage.setItem("JARVIS_PAT", token);
                    CONFIG.pat = token;
                }
            }
            loadLocalState();
            syncWithGitHubMemory();
            setInterval(syncWithGitHubMemory, 5000); // Sanftes Background-Polling
        });

        function saveLocalState(messages) {
            localStorage.setItem("JARVIS_CHAT_CACHE", JSON.stringify(messages));
        }

        function loadLocalState() {
            const cached = localStorage.getItem("JARVIS_CHAT_CACHE");
            if (cached) {
                try {
                    renderMessages(JSON.parse(cached));
                } catch (e) {}
            }
        }

        // --- REPOSITORY DISPATCH (Befehl senden) ---
        async function sendTask() {
            const input = document.getElementById("prompt-input");
            const text = input.value.trim();
            if (!text || isWorking) return;

            input.value = "";
            setWorkingState(true);

            // Optimistisches UI-Update (schützt vor Reload-Verlust)
            const chat = document.getElementById("chat-container");
            appendMessage("user", text);

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/dispatches`, {
                    method: "POST",
                    headers: {
                        "Accept": "application/vnd.github+json",
                        "Authorization": `Bearer ${CONFIG.pat}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        event_type: "jarvis-task",
                        client_payload: { prompt: text }
                    })
                });

                if (!res.ok) throw new Error("Dispatch gescheitert");
                workStartTime = Date.now();
                startPolling();
            } catch (err) {
                alert("Fehler beim Senden: " + err.message);
                setWorkingState(false);
            }
        }

        // --- POLLING & SYNC ---
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                const updated = await syncWithGitHubMemory();
                // Timeout-Fallback nach 90 Sekunden
                if (Date.now() - workStartTime > 90000) {
                    clearInterval(pollInterval);
                    setWorkingState(false);
                    appendMessage("assistant", "⚠️ System-Meldung: Lauf-Timeout (90s). Bitte prüfe den GitHub Actions Status.");
                }
                if (updated && !isWorking) {
                    clearInterval(pollInterval);
                }
            }, 3000);
        }

        async function syncWithGitHubMemory() {
            try {
                // Cache-Busting Parameter gegen CDN-Caching auf GitHub Pages
                const res = await fetch(`${CONFIG.memoryUrl}?t=${Date.now()}`);
                if (!res.ok) return false;
                
                const data = await res.json();
                
                // Status prüfen & UI entriegeln, sobald der Lauf beendet ist
                if (isWorking && data.last_updated) {
                    const updateTime = new Date(data.last_updated).getTime();
                    if (updateTime > workStartTime) {
                        setWorkingState(false);
                        renderMessages(data.history || []);
                        saveLocalState(data.history || []);
                        return true;
                    }
                } else if (!isWorking) {
                    renderMessages(data.history || []);
                    saveLocalState(data.history || []);
                }
            } catch (err) {
                console.warn("Sync Fehler:", err);
            }
            return false;
        }

        // --- RENDERING & Δ DIFF LOGIK ---
        function renderMessages(history) {
            const container = document.getElementById("chat-container");
            container.innerHTML = "";
            history.forEach(entry => appendMessage(entry.role, entry.content));
        }

        function appendMessage(role, content) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${role}`;
            
            // Diff-Erkennung und UI-Symbol (Δ)
            const diffMatch = content.match(/```diff([\s\S]*?)```/);
            if (diffMatch && role === "assistant") {
                const cleanText = content.replace(/```diff[\s\S]*?```/, "").trim();
                div.textContent = cleanText || "JARVIS hat einen Code-Diff/Tool generiert:";
                
                const badge = document.createElement("div");
                badge.className = "diff-badge";
                badge.innerHTML = "Δ Code-Diff prüfen & bestätigen";
                badge.onclick = () => openDiffModal(diffMatch[1].trim());
                div.appendChild(badge);
            } else {
                div.textContent = content;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function setWorkingState(working) {
            isWorking = working;
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");
            const progress = document.getElementById("progress-bar");
            const btn = document.getElementById("send-btn");

            if (working) {
                dot.classList.add("active");
                text.textContent = "JARVIS arbeitet...";
                progress.classList.add("loading");
                btn.disabled = true;
            } else {
                dot.classList.remove("active");
                text.textContent = "Bereit";
                progress.classList.remove("loading");
                btn.disabled = false;
            }
        }

        // --- MODAL & BESTÄTIGUNGS-PRINZIP ---
        function openDiffModal(diffText) {
            currentDiff = diffText;
            document.getElementById("diff-content").textContent = diffText;
            document.getElementById("diff-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("diff-modal").style.display = "none";
            currentDiff = "";
        }

        async function confirmDiff() {
            closeModal();
            setWorkingState(true);
            appendMessage("user", "Δ Diff bestätigt. Führe Integration aus...");

            try {
                await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/dispatches`, {
                    method: "POST",
                    headers: {
                        "Accept": "application/vnd.github+json",
                        "Authorization": `Bearer ${CONFIG.pat}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        event_type: "jarvis-confirm-diff",
                        client_payload: { prompt: "BESTÄTIGT: Führe folgenden Diff/Tool-Integration aus:\n" + currentDiff }
                    })
                });
                workStartTime = Date.now();
                startPolling();
            } catch (err) {
                alert("Fehler bei Diff-Bestätigung: " + err.message);
                setWorkingState(false);
            }
        }
    </script>
</body>
</html>
