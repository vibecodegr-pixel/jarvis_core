<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Core</title>
    <style>
        body { font-family: sans-serif; background: #0f0f12; color: #fff; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { color: #8ab4f8; margin: 0 0 10px 0; }
        .dash { background: #181824; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        #chat { flex-grow: 1; background: #16161f; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
        .user { color: #e4e4ed; margin: 8px 0; }
        .agent { color: #a8d5ba; background: #1e1e2d; padding: 10px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; }
        .warn { color: #ff6b6b; background: #2d1e1e; padding: 8px; border-radius: 6px; margin: 8px 0; word-break: break-all; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; background: #22222e; color: #fff; border: 1px solid #3a3a4c; border-radius: 6px; box-sizing: border-box; }
        .input-row { display: flex; gap: 8px; margin-top: 5px; }
        button { padding: 10px 15px; background: #8ab4f8; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🤖 JARVIS CORE</h2>
    <div class="dash">
        <span>Quota: <b id="qVal">100</b> / 100</span>
        <button onclick="addQ()">+100</button>
    </div>
    <div style="margin-bottom:10px;">
        <input type="password" id="key" placeholder="Gemini API Key..." onchange="localStorage.setItem('j_key', this.value.trim())">
    </div>
    <div id="chat"><i>Bereit...</i></div>
    <div class="input-row">
        <input type="text" id="msg" placeholder="Befehl..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Senden</button>
    </div>

    <script>
        document.getElementById('key').value = localStorage.getItem('j_key') || '';
        let quota = 100;

        function addQ() {
            quota += 100;
            document.getElementById('qVal').innerText = quota;
        }

        async function send() {
            let k = document.getElementById('key').value.trim();
            let m = document.getElementById('msg').value.trim();
            let c = document.getElementById('chat');

            if(!k) { alert('API-Key fehlt!'); return; }
            if(!m) return;
            if(quota <= 0) { alert('Quota leer!'); return; }

            c.innerHTML += `<div class="user"><b>Du:</b> ${m}</div>`;
            document.getElementById('msg').value = '';
            
            let load = document.createElement('div');
            load.innerText = 'JARVIS denkt nach...';
            c.appendChild(load);

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: m }] }] })
                });

                let data = await res.json();
                load.remove();

                if(res.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                    let text = data.candidates[0].content.parts[0].text;
                    c.innerHTML += `<div class="agent"><b>JARVIS:</b><br>${text}</div>`;
                    quota--;
                    document.getElementById('qVal').innerText = quota;
                } else {
                    let err = data.error ? data.error.message : JSON.stringify(data);
                    c.innerHTML += `<div class="warn">Fehler: ${err}</div>`;
                }
            } catch(e) {
                load.remove();
                c.innerHTML += `<div class="warn">Netzwerkfehler: ${e.message}</div>`;
            }
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
