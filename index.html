<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Core - Control Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #e4e4ed; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; box-sizing: border-box; }
        h2 { color: #8ab4f8; text-align: center; margin: 0 0 10px 0; font-size: 1.3rem; }
        
        .dashboard { background: #181824; border: 1px solid #2a2a38; border-radius: 10px; padding: 10px 15px; margin-bottom: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; }
        .stat-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-item { color: #aaa; }
        .stat-val { color: #8ab4f8; font-weight: bold; }
        .stat-pro { color: #f2a65a; font-weight: bold; }
        .stat-flash { color: #5cf28e; font-weight: bold; }
        .btn-small { padding: 6px 12px; background: #8ab4f8; color: #0f0f12; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        
        #chat { flex-grow: 1; border: 1px solid #2a2a35; padding: 15px; margin-bottom: 12px; overflow-y: auto; background: #16161f; border-radius: 10px; }
        .user-line { margin: 10px 0; color: #e4e4ed; }
        .system-line { margin: 10px 0; color: #8ab4f8; font-style: italic; font-size: 0.85rem; }
        .warn-line { margin: 10px 0; color: #ff6b6b; font-weight: bold; background: #2d1e1e; padding: 10px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; }
        .agent-line { margin: 10px 0; color: #a8d5ba; background: #1e1e2d; padding: 12px; border-radius: 8px; border-left: 4px solid #8ab4f8; white-space: pre-wrap; line-height: 1.4; font-size: 0.95rem; }
        
        .config-box { margin-bottom: 12px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; background: #22222e; color: #fff; border: 1px solid #3a3a4c; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 0.9rem; }
        .msg-box { display: flex; gap: 8px; width: 100%; }
        .btn-send { padding: 12px 20px; background: #8ab4f8; color: #0f0f12; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>
    <h2>🤖 JARVIS CORE (SMART ROUTER)</h2>
    
    <div class="dashboard">
        <div class="stat-group">
            <div class="stat-item">⚡ PRO übrig: <span class="stat-pro" id="proCount">50</span>/50</div>
            <div class="stat-item">🚀 FLASH übrig: <span class="stat-flash" id="flashCount">1500</span>/1500</div>
            <div class="stat-item">🛡️ Session-Puffer: <span class="stat-val" id="sessionQuota">100</span></div>
        </div>
        <button class="btn-small" onclick="releaseQuota(100)">+ 100 Puffer</button>
    </div>

    <div class="config-box">
        <input type="password" id="apiKey" placeholder="Gemini API-Key eintragen..." onchange="localStorage.setItem('jarvis_gemini_key', this.value.trim())">
    </div>

    <div id="chat"><div class="system-line">JARVIS Core online. Smart-Router aktiv – bereit für Befehle...</div></div>
    
    <div class="msg-box">
        <input type="text" id="msg" placeholder="Befehl an JARVIS..." onkeypress="if(event.key === 'Enter') send();">
        <button class="btn-send" onclick="send()">Senden</button>
    </div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('jarvis_gemini_key') || '';
        
        // --- QUOTA & AUTOMATISCHER MITTERNACHTS-RESET ---
        let todayStr = new Date().toISOString().slice(0, 10);
        let savedDate = localStorage.getItem('jarvis_date');
        
        if (savedDate !== todayStr) {
            localStorage.setItem('jarvis_date', todayStr);
            localStorage.setItem('jarvis_pro_used', '0');
            localStorage.setItem('jarvis_flash_used', '0');
        }

        let proUsed = parseInt(localStorage.getItem('jarvis_pro_used') || '0');
        let flashUsed = parseInt(localStorage.getItem('jarvis_flash_used') || '0');
        let sessionQuota = 100;
        let lastRequests = [];

        function updateDisplay() {
            let proLeft = Math.max(0, 50 - proUsed);
            let flashLeft = Math.max(0, 1500 - flashUsed);
            document.getElementById('proCount').innerText = proLeft;
            document.getElementById('flashCount').innerText = flashLeft;
            document.getElementById('sessionQuota').innerText = sessionQuota;
        }
        updateDisplay();

        function releaseQuota(amount) {
            sessionQuota += amount;
            updateDisplay();
            addSystemMsg(`✅ Session-Puffer um +${amount} erhöht. (Verfügbar: ${sessionQuota})`);
        }

        function detectLoop(promptText) {
            let now = Date.now();
            lastRequests = lastRequests.filter(r => (now - r.time) < 30000);
            let duplicates = lastRequests.filter(r => r.prompt === promptText);
            lastRequests.push({ prompt: promptText, time: now });
            return duplicates.length >= 2;
        }

        // --- INTELLIGENTER SMART-ROUTER (KOMPLEXITÄTS-ANALYSE) ---
        function smartRoute(text) {
            // 1. Erkennt Code-Syntax (Klammern, Zuweisungen, HTML/JS)
            const hasCodeSyntax = /[{};=<>]/g.test(text) && text.length > 25;
            
            // 2. Erkennt Problemlösungs-, Bau- und Analyse-Wörter
            const techTerms = ['code', 'fehler', 'bug', 'script', 'html', 'css', 'js', 'javascript', 'python', 'json', 'github', 'fix', 'funktioniert nicht', 'wieso', 'warum', 'schleife', 'api', 'repository', 'commit', 'anleitung', 'erkläre', 'optimier', 'schreibe', 'bau', 'system', 'problem'];
            const lower = text.toLowerCase();
            const hasTechTerm = techTerms.some(term => lower.includes(term));
            
            // 3. Längere und komplexere Anfragen
            const isLong = text.length > 130;

            if (hasCodeSyntax || hasTechTerm || isLong) {
                return { id: "gemini-2.5-pro", name: "PRO 2.5 (Komplex/Code)", isPro: true };
            }
            return { id: "gemini-2.5-flash", name: "FLASH 2.5 (Standard/Schnell)", isPro: false };
        }

        // --- BEFEHL SENDEN ---
        async function send() {
            let key = document.getElementById('apiKey').value.trim();
            let msgInput = document.getElementById('msg');
            let msg = msgInput.value.trim();
            let chat = document.getElementById('chat');

            if(!key) { alert('Bitte trage zuerst deinen Gemini API-Key in das obere Feld ein!'); return; }
            if(!msg) return;

            if(sessionQuota <= 0) {
                addWarnMsg("⚠️ Session-Puffer leer! Klicke oben auf '+ 100 Puffer'.");
                return;
            }

            if(detectLoop(msg)) {
                addWarnMsg("🚨 SCHLEIFE ERKANNT: Derselbe Befehl wurde mehrfach in 30s gefeuert. Abbruch zum Quota-Schutz.");
                return;
            }

            // Route bestimmen
            let route = smartRoute(msg);

            chat.innerHTML += '<div class="user-line"><b>Du:</b> ' + escapeHtml(msg) + '</div>';
            msgInput.value = '';
            chat.scrollTop = chat.scrollHeight;

            chat.innerHTML += `<div class="system-line" id="loading">➔ Smart-Router wählt <b>${route.name}</b> – verarbeite...</div>`;
            chat.scrollTop = chat.scrollHeight;

            // System-Instruction aus GitHub laden
            let systemPrompt = "Du bist JARVIS, ein autonomer Assistent.";
            try {
                let instructRes = await fetch("instructions.md?t=" + new Date().getTime());
                if(instructRes.ok) systemPrompt = await instructRes.text();
            } catch(e){}

            // Zähler sofort für den Versuch belasten (damit auch Fehler getrackt werden!)
            sessionQuota--;
            if (route.isPro) {
                proUsed++;
                localStorage.setItem('jarvis_pro_used', proUsed);
            } else {
                flashUsed++;
                localStorage.setItem('jarvis_flash_used', flashUsed);
            }
            updateDisplay();

            try {
                let url = `https://generativelanguage.googleapis.com/v1beta/models/${route.id}:generateContent?key=${key}`;
                
                let response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: msg }] }]
                    })
                });

                let data = await response.json();
                removeLoader();

                if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                    let reply = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += '<div class="agent-line"><b>JARVIS (' + (route.isPro ? 'PRO' : 'FLASH') + '):</b><br>' + escapeHtml(reply) + '</div>';
                } else {
                    let errMessage = data.error ? data.error.message : JSON.stringify(data);
                    addWarnMsg(`⚠️ API-Fehler (${route.id}): ` + errMessage);
                }
            } catch (err) {
                removeLoader();
                addWarnMsg("⚠️ Netzwerk- oder Verbindungsfehler: " + err.message);
            }

            chat.scrollTop = chat.scrollHeight;
        }

        function removeLoader() {
            let loader = document.getElementById('loading');
            if(loader) loader.remove();
        }

        function addSystemMsg(text) {
            let chat = document.getElementById('chat');
            chat.innerHTML += '<div class="system-line">' + text + '</div>';
            chat.scrollTop = chat.scrollHeight;
        }

        function addWarnMsg(text) {
            let chat = document.getElementById('chat');
            chat.innerHTML += '<div class="warn-line">' + text + '</div>';
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
