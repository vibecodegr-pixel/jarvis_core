<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Cloud Control</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #e4e4ed; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; box-sizing: border-box; }
        h2 { color: #8ab4f8; text-align: center; margin: 0 0 10px 0; font-size: 1.3rem; }
        
        .dashboard { background: #181824; border: 1px solid #2a2a38; border-radius: 10px; padding: 10px 15px; margin-bottom: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.85rem; }
        .btn-small { padding: 6px 12px; background: #8ab4f8; color: #0f0f12; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-cloud { background: #5cf28e; }
        
        #chat { flex-grow: 1; border: 1px solid #2a2a35; padding: 15px; margin-bottom: 12px; overflow-y: auto; background: #16161f; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .user-line { color: #e4e4ed; background: #22222e; padding: 10px; border-radius: 8px; align-self: flex-end; max-width: 85%; word-break: break-word; }
        .system-line { color: #8ab4f8; font-style: italic; font-size: 0.85rem; text-align: center; }
        .warn-line { color: #ff6b6b; font-weight: bold; background: #2d1e1e; padding: 10px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; }
        .agent-line { color: #a8d5ba; background: #1e1e2d; padding: 12px; border-radius: 8px; border-left: 4px solid #5cf28e; white-space: pre-wrap; line-height: 1.4; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
        
        .config-box { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; background: #22222e; color: #fff; border: 1px solid #3a3a4c; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 0.9rem; }
        .msg-box { display: flex; gap: 8px; width: 100%; }
        .btn-send { padding: 12px 20px; background: #5cf28e; color: #0f0f12; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>
    <h2>🤖 JARVIS CLOUD CONTROL</h2>
    
    <div class="dashboard">
        <div style="color: #aaa;">Status: <span style="color: #5cf28e; font-weight: bold;">Qwen Cloud Agent aktiv</span></div>
        <div style="display: flex; gap: 6px;">
            <a id="downloadLink" class="btn-small" href="#" onclick="downloadRepoZip(event)">📦 Repo als ZIP</a>
            <button class="btn-small btn-cloud" onclick="triggerJarvisAgent()">🚀 Direkt starten</button>
        </div>
    </div>

    <div class="config-box">
        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token eintragen..." oninput="localStorage.setItem('jarvis_gh_token', this.value.trim())">
        <input type="text" id="ntfyTopic" placeholder="ntfy.sh Thema (z.B. jarvis-status-GR-998877)..." oninput="localStorage.setItem('jarvis_ntfy_topic', this.value.trim())">
    </div>

    <div id="chat"><div class="system-line">Steuerzentrale bereit.</div></div>
    
    <div class="msg-box">
        <input type="text" id="msg" placeholder="Befehl für JARVIS..." onkeypress="if(event.key === 'Enter') triggerJarvisAgent();">
        <button class="btn-send" onclick="triggerJarvisAgent()">Senden</button>
    </div>

    <script>
        document.getElementById('ghToken').value = localStorage.getItem('jarvis_gh_token') || '';
        document.getElementById('ntfyTopic').value = localStorage.getItem('jarvis_ntfy_topic') || '';

        // Beim Start: Lokalen Chat-Verlauf laden und mit GitHub synchronisieren
        window.onload = async function() {
            loadLocalChat();
            await syncWithGitHubMemory();
        };

        function getRepoInfo() {
            let host = window.location.hostname;
            let owner = host.split('.')[0];
            let pathSegments = window.location.pathname.split('/').filter(Boolean);
            let repo = pathSegments.length > 0 ? pathSegments[0] : 'jarvis_core';
            return { owner, repo };
        }

        function downloadRepoZip(e) {
            e.preventDefault();
            let repoInfo = getRepoInfo();
            let zipUrl = `https://github.com/${repoInfo.owner}/${repoInfo.repo}/archive/refs/heads/main.zip`;
            window.open(zipUrl, '_blank');
            appendMessage('system', '📦 Full-Repo ZIP-Download gestartet.');
        }

        async function syncWithGitHubMemory() {
            let repoInfo = getRepoInfo();
            try {
                let res = await fetch(`https://raw.githubusercontent.com/${repoInfo.owner}/${repoInfo.repo}/main/memory.json?t=` + Date.now());
                if (res.ok) {
                    let history = await res.json();
                    let chat = document.getElementById('chat');
                    // Wenn der Chat leer ist oder nur die Willkommensnachricht hat, füllen wir mit memory.json auf
                    if (history && history.length > 0) {
                        chat.innerHTML = '<div class="system-line">Verlauf mit Cloud synchronisiert.</div>';
                        history.forEach(item => {
                            appendMessage('user', item.cmd, false);
                            appendMessage('agent', item.ans, false);
                        });
                    }
                }
            } catch (e) {
                // Stumm bleiben, falls Offline oder Token fehlt
            }
        }

        function loadLocalChat() {
            let savedChat = localStorage.getItem('jarvis_chat_history');
            if (savedChat) {
                document.getElementById('chat').innerHTML = savedChat;
            }
        }

        function saveLocalChat() {
            let chatHTML = document.getElementById('chat').innerHTML;
            localStorage.setItem('jarvis_chat_history', chatHTML);
        }

        function appendMessage(type, text, save = true) {
            let chat = document.getElementById('chat');
            let div = document.createElement('div');
            
            if (type === 'user') {
                div.className = 'user-line';
                div.innerHTML = '<b>Du:</b> ' + escapeHtml(text);
            } else if (type === 'agent') {
                div.className = 'agent-line';
                div.innerHTML = '<b>JARVIS:</b><br>' + escapeHtml(text);
            } else if (type === 'system') {
                div.className = 'system-line';
                div.innerHTML = text;
            } else if (type === 'warn') {
                div.className = 'warn-line';
                div.innerHTML = text;
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if (save) saveLocalChat();
        }

        async function triggerJarvisAgent() {
            let ghToken = document.getElementById('ghToken').value.trim() || localStorage.getItem('jarvis_gh_token');
            let msgInput = document.getElementById('msg');
            let commandText = msgInput.value.trim();

            if (!ghToken) {
                alert('Bitte trage zuerst deinen GitHub Personal Access Token ein!');
                return;
            }
            if (!commandText) return;

            let repoInfo = getRepoInfo();
            
            appendMessage('user', commandText);
            msgInput.value = '';

            appendMessage('system', 'Läuft. Der Agent schraubt im Hintergrund daran – gleich klingelt das Handy mit dem Update.');

            try {
                let response = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/actions/workflows/jarvis-agent.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            command: commandText
                        }
                    })
                });

                if (!response.ok) {
                    let errJson = await response.json();
                    appendMessage('warn', '⚠️ Fehler beim Starten: ' + (errJson.message || response.statusText));
                }
            } catch (error) {
                appendMessage('warn', '⚠️ Netzwerkfehler: ' + error.message);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
