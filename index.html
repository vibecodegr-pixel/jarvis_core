<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Cloud Control</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #e4e4ed; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; box-sizing: border-box; }
        h2 { color: #8ab4f8; text-align: center; margin: 0 0 10px 0; font-size: 1.3rem; }
        
        .dashboard { background: #181824; border: 1px solid #2a2a38; border-radius: 10px; padding: 10px 15px; margin-bottom: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.85rem; }
        .btn-small { padding: 6px 12px; background: #8ab4f8; color: #0f0f12; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-cloud { background: #5cf28e; }
        .btn-snapshot { background: #f0ad4e; }
        
        #chat { flex-grow: 1; border: 1px solid #2a2a35; padding: 15px; margin-bottom: 12px; overflow-y: auto; background: #16161f; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .user-line { color: #e4e4ed; background: #22222e; padding: 10px; border-radius: 8px; align-self: flex-end; max-width: 85%; word-break: break-word; }
        .system-line { color: #8ab4f8; font-style: italic; font-size: 0.85rem; text-align: center; }
        .warn-line { color: #ff6b6b; font-weight: bold; background: #2d1e1e; padding: 10px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; }
        .agent-line { color: #a8d5ba; background: #1e1e2d; padding: 12px; border-radius: 8px; border-left: 4px solid #5cf28e; white-space: pre-wrap; line-height: 1.4; font-size: 0.95rem; width: 100%; box-sizing: border-box; position: relative; }
        
        /* Diff & Indikator Styling */
        .diff-indicator { display: inline-flex; align-items: center; justify-content: center; background: #f0ad4e; color: #0f0f12; width: 22px; height: 22px; border-radius: 50%; font-weight: bold; cursor: pointer; margin-left: 8px; font-size: 0.8rem; vertical-align: middle; }
        .diff-modal { display: none; background: #12121a; border: 1px solid #f0ad4e; padding: 10px; border-radius: 6px; margin-top: 10px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; color: #f9f9f9; }

        /* Snapshot Popup Modal Styling */
        #snapshotModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .snapshot-modal-content { background: #181824; border: 1px solid #f0ad4e; border-radius: 12px; width: 100%; max-width: 600px; max-height: 85vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .snapshot-scroll-area { flex-grow: 1; background: #12121a; border: 1px solid #2a2a38; border-radius: 8px; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #e4e4ed; white-space: pre-wrap; margin: 15px 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-modal-export { background: #5cf28e; color: #0f0f12; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-modal-cancel { background: #ff6b6b; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Ladebalken Animation */
        .loader-container { width: 100%; background: #2a2a38; border-radius: 4px; height: 6px; overflow: hidden; margin-top: 8px; }
        .loader-bar { width: 100%; background: #5cf28e; height: 100%; animation: indeterminate 1.5s infinite linear; transform-origin: left; }
        @keyframes indeterminate { 0% { transform: translateX(0) scaleX(0); } 40% { transform: translateX(0) scaleX(0.4); } 100% { transform: translateX(100%) scaleX(0.5); } }
        .loader-text { font-size: 0.75rem; color: #8ab4f8; margin-top: 4px; font-style: italic; }

        .config-box { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; background: #22222e; color: #fff; border: 1px solid #3a3a4c; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 0.9rem; }
        .msg-box { display: flex; gap: 8px; width: 100%; }
        .btn-send { padding: 12px 20px; background: #5cf28e; color: #0f0f12; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>
    <h2>🤖 JARVIS CLOUD CONTROL</h2>
    
    <div class="dashboard">
        <div style="color: #aaa;">Status: <span style="color: #5cf28e; font-weight: bold;">Qwen Cloud Agent aktiv</span></div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="btn-small btn-snapshot" onclick="openSnapshotPopup()">📸 Snapshot</button>
            <a id="downloadLink" class="btn-small" href="#" onclick="downloadRepoZip(event)">📦 ZIP</a>
            <button class="btn-small btn-cloud" onclick="triggerJarvisAgent()">🚀 Start</button>
        </div>
    </div>

    <!-- Snapshot Modal Popup -->
    <div id="snapshotModalOverlay">
        <div class="snapshot-modal-content">
            <h3 style="color: #f0ad4e; margin: 0 0 10px 0; font-size: 1.1rem;">Projekt-Snapshot (Delta-Vorschau)</h3>
            <div style="font-size: 0.8rem; color: #aaa;">Prüfe den Inhalt vor dem Export. Beim Export wird der aktuelle Stand heruntergeladen und der Zyklus für den nächsten Snapshot zurückgesetzt.</div>
            <div id="snapshotContentArea" class="snapshot-scroll-area">Lade Delta-Daten aus dem Repository...</div>
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeSnapshotPopup()">Abbrechen</button>
                <button class="btn-modal-export" onclick="executeSnapshotExport()">Export & Reset</button>
            </div>
        </div>
    </div>

    <div class="config-box">
        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token..." oninput="localStorage.setItem('jarvis_gh_token', this.value.trim())">
        <input type="text" id="ntfyTopic" placeholder="ntfy.sh Thema..." oninput="localStorage.setItem('jarvis_ntfy_topic', this.value.trim())">
    </div>

    <div id="chat"><div class="system-line">Steuerzentrale bereit.</div></div>
    
    <div class="msg-box">
        <input type="text" id="msg" placeholder="Befehl für JARVIS..." onkeypress="if(event.key === 'Enter') triggerJarvisAgent();">
        <button class="btn-send" onclick="triggerJarvisAgent()">Senden</button>
    </div>

    <script>
        document.getElementById('ghToken').value = localStorage.getItem('jarvis_gh_token') || '';
        document.getElementById('ntfyTopic').value = localStorage.getItem('jarvis_ntfy_topic') || '';

        window.onload = async function() {
            loadLocalChat();
            await syncWithGitHubMemory();
        };

        function getRepoInfo() {
            let host = window.location.hostname;
            let owner = host.split('.')[0];
            let pathSegments = window.location.pathname.split('/').filter(Boolean);
            let repo = pathSegments.length > 0 ? pathSegments[0] : 'jarvis_core';
            return { owner, repo };
        }

        function downloadRepoZip(e) {
            e.preventDefault();
            let repoInfo = getRepoInfo();
            window.open(`https://github.com/${repoInfo.owner}/${repoInfo.repo}/archive/refs/heads/main.zip`, '_blank');
            appendMessage('system', '📦 Full-Repo ZIP-Download gestartet.');
        }

        // --- Snapshot Popup Logic ---
        async function openSnapshotPopup() {
            let modal = document.getElementById('snapshotModalOverlay');
            let contentArea = document.getElementById('snapshotContentArea');
            modal.style.display = 'flex';
            contentArea.innerText = 'Lade aktuellen Projekt-Stand & Delta...';

            let repoInfo = getRepoInfo();
            try {
                let res = await fetch(`https://raw.githubusercontent.com/${repoInfo.owner}/${repoInfo.repo}/main/memory.json?t=` + Date.now());
                if (res.ok) {
                    let history = await res.json();
                    let deltaText = "# Projekt-Snapshot (Delta-Ansicht)\n\n### Letzte Aktivitäten seit dem letzten Snapshot:\n";
                    if (history && history.length > 0) {
                        history.slice(-10).forEach(item => {
                            deltaText += `- **Befehl:** ${item.cmd}\n  **Antwort:** ${item.ans.substring(0, 120)}...\n\n`;
                        });
                    } else {
                        deltaText += "Keine neuen Einträge im Gedächtnis gefunden.\n";
                    }
                    contentArea.innerText = deltaText;
                } else {
                    contentArea.innerText = "Fehler beim Laden der Repository-Daten.";
                }
            } catch (err) {
                contentArea.innerText = "Netzwerkfehler beim Abrufen des Snapshots: " + err.message;
            }
        }

        function closeSnapshotPopup() {
            document.getElementById('snapshotModalOverlay').style.display = 'none';
        }

        function executeSnapshotExport() {
            let contentText = document.getElementById('snapshotContentArea').innerText;
            
            // Download als .md Datei initiieren
            let blob = new Blob([contentText], { type: 'text/markdown;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'project_snapshot.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            closeSnapshotPopup();
            appendMessage('system', '📸 Snapshot erfolgreich exportiert und heruntergeladen. Zyklus zurückgesetzt.');

            // Optional: Befehl an JARVIS senden, um den Cleanup/Metadaten-Reset im Repo anzustoßen
            document.getElementById('msg').value = "Snapshot Export abgeschlossen. Setze den Snapshot-Zeitstempel in der Meta-Datei neu und bereinige den alten Delta-Puffer.";
            triggerJarvisAgent();
        }
        // ----------------------------

        async function syncWithGitHubMemory() {
            let repoInfo = getRepoInfo();
            try {
                let res = await fetch(`https://raw.githubusercontent.com/${repoInfo.owner}/${repoInfo.repo}/main/memory.json?t=` + Date.now());
                if (res.ok) {
                    let history = await res.json();
                    let chat = document.getElementById('chat');
                    if (history && history.length > 0) {
                        chat.innerHTML = '<div class="system-line">Verlauf mit Cloud synchronisiert.</div>';
                        history.forEach(item => {
                            appendMessage('user', item.cmd, false);
                            appendMessage('agent', item.ans, false, item.diff);
                        });
                    }
                }
            } catch (e) {}
        }

        function loadLocalChat() {
            let savedChat = localStorage.getItem('jarvis_chat_history');
            if (savedChat) {
                document.getElementById('chat').innerHTML = savedChat;
            }
        }

        function saveLocalChat() {
            localStorage.setItem('jarvis_chat_history', document.getElementById('chat').innerHTML);
        }

        function appendMessage(type, text, save = true, diffData = null) {
            let chat = document.getElementById('chat');
            let div = document.createElement('div');
            
            if (type === 'user') {
                div.className = 'user-line';
                div.innerHTML = '<b>Du:</b> ' + escapeHtml(text);
            } else if (type === 'agent') {
                div.className = 'agent-line';
                let html = '<b>JARVIS:</b><br>' + escapeHtml(text);
                
                if (diffData) {
                    html += ` <span class="diff-indicator" title="Änderungen prüfen" onclick="toggleDiff(this)">Δ</span>`;
                    html += `<div class="diff-modal"><b>Geplante Änderungen (Diff):</b>\n${escapeHtml(diffData)}\n\n<button onclick="approveDiff(true)" style="background:#5cf28e;border:none;padding:4px 8px;font-weight:bold;cursor:pointer;border-radius:4px;">Bestätigen</button> <button onclick="approveDiff(false)" style="background:#ff6b6b;border:none;padding:4px 8px;font-weight:bold;cursor:pointer;border-radius:4px;color:#fff;">Ablehnen</button></div>`;
                }
                div.innerHTML = html;
            } else if (type === 'system') {
                div.className = 'system-line';
                div.innerHTML = text;
            } else if (type === 'warn') {
                div.className = 'warn-line';
                div.innerHTML = text;
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if (save) saveLocalChat();
        }

        function toggleDiff(el) {
            let modal = el.nextElementSibling;
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function approveDiff(accepted) {
            if (accepted) {
                document.getElementById('msg').value = "Diff bestätigt. Führe die Änderung aus.";
                triggerJarvisAgent();
            } else {
                appendMessage('system', '❌ Änderung abgelehnt.');
            }
        }

        async function triggerJarvisAgent() {
            let ghToken = document.getElementById('ghToken').value.trim() || localStorage.getItem('jarvis_gh_token');
            let msgInput = document.getElementById('msg');
            let commandText = msgInput.value.trim();

            if (!ghToken) {
                alert('Bitte GitHub Token eintragen!');
                return;
            }
            if (!commandText) return;

            let repoInfo = getRepoInfo();
            appendMessage('user', commandText);
            msgInput.value = '';

            let chat = document.getElementById('chat');
            let loadDiv = document.createElement('div');
            loadDiv.className = 'agent-line';
            loadDiv.innerHTML = `<b>JARVIS arbeitet...</b><div class="loader-text">Analysiere Befehl & bereite Aktion vor...</div><div class="loader-container"><div class="loader-bar"></div></div>`;
            chat.appendChild(loadDiv);
            chat.scrollTop = chat.scrollHeight;

            try {
                let response = await fetch(`https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/actions/workflows/jarvis-agent.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: { command: commandText }
                    })
                });

                loadDiv.remove();
                if (response.ok) {
                    appendMessage('system', 'Läuft. Der Agent schraubt im Hintergrund daran – gleich klingelt das Handy mit dem Update.');
                } else {
                    let errJson = await response.json();
                    appendMessage('warn', '⚠️ Fehler beim Starten: ' + (errJson.message || response.statusText));
                }
            } catch (error) {
                loadDiv.remove();
                appendMessage('warn', '⚠️ Netzwerkfehler: ' + error.message);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
