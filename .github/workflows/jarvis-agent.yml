name: JARVIS Cloud Agent (HF API & Dynamic)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Befehl für JARVIS'
        required: true
        default: 'System-Check'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: JARVIS über Hugging Face API ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          python -c "
          import requests
          import os
          import time

          start_time = time.time()
          token = os.environ.get('HF_TOKEN')
          command = os.environ.get('USER_COMMAND', 'System-Check')
          topic = os.environ.get('NTFY_TOPIC', 'jarvis-status-GR-998877')

          print(f'[Tracking] Starte HF-Inferenz für: {command}')
          
          url = 'https://api-inference.huggingface.co/models/NousResearch/Hermes-3-Llama-3.1-8B-Instruct'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }
          payload = {
              'inputs': f'Du bist JARVIS, ein autonomer Software-Agent. Führe folgenden Befehl aus und antworte präzise: {command}',
              'parameters': {'max_new_tokens': 400, 'return_full_text': False}
          }

          status = 'ERFOLG'
          answer = ''

          try:
              response = requests.post(url, headers=headers, json=payload, timeout=60)
              
              if response.status_code == 503:
                  print('[Pacing] Modell lädt auf HF-Servern. Warte 15s...')
                  time.sleep(15)
                  response = requests.post(url, headers=headers, json=payload, timeout=60)

              response.raise_for_status()
              res_json = response.json()

              if isinstance(res_json, list) and len(res_json) > 0:
                  answer = res_json[0].get('generated_text', str(res_json))
              elif isinstance(res_json, dict):
                  answer = res_json.get('generated_text', res_json.get('error', str(res_json)))
              else:
                  answer = str(res_json)

          except Exception as e:
              status = 'FEHLER'
              answer = str(e)
              print(f'Fehler aufgetreten: {e}')

          duration = round(time.time() - start_time, 2)
          print(f'[Tracking] Beendet. Status: {status} | Dauer: {duration}s')

          notif_text = f'🤖 JARVIS [{status}] ({duration}s)\nBefehl: {command}\nAntwort: {answer[:150]}...'
          requests.post(f'https://ntfy.sh/{topic}', data=notif_text.encode('utf-8'))
          "

      - name: Änderungen committen & pushen
        run: |
          git config --global user.name 'JARVIS Cloud Agent'
          git config --global user.email 'agent@jarvis.local'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 [HF Agent] Ausführung beendet' && git push)
