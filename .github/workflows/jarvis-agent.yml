name: JARVIS Cloud Agent (Tracked & Paced)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Befehl für JARVIS'
        required: true
        default: 'System-Check'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Agent mit Tracking & Pacing ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          python -c "
          import urllib.request
          import urllib.error
          import json
          import os
          import time

          # --- TRACKING: Startzeit erfassen ---
          start_time = time.time()
          token = os.environ.get('HF_TOKEN')
          command = os.environ.get('USER_COMMAND')
          topic = os.environ.get('NTFY_TOPIC', 'jarvis-status-GR-998877')

          print(f'[Tracking] Starte Ausführung für Befehl: {command}')
          
          # --- PACING: Kurze Init-Pause zur Entlastung ---
          time.sleep(1)

          url = 'https://api-inference.huggingface.co/models/NousResearch/Hermes-3-Llama-3.1-8B-Instruct'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }
          
          payload = json.dumps({
              'inputs': f'Du bist JARVIS, ein autonomer Software-Agent. Führe folgenden Befehl aus und antworte präzise: {command}',
              'parameters': {'max_new_tokens': 400, 'return_full_text': False}
          }).encode('utf-8')

          req = urllib.request.Request(url, data=payload, headers=headers, method='POST')
          
          answer = 'Keine Antwort'
          status = 'ERFOLG'
          
          try:
              # --- PACING & RETRY LOGIK (Fängt den 'Modell lädt'-Fehler 503 ab) ---
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req) as response:
                          res_body = response.read().decode('utf-8')
                          result = json.loads(res_body)
                          if isinstance(result, list) and len(result) > 0:
                              answer = result[0].get('generated_text', str(result))
                          elif isinstance(result, dict):
                              answer = result.get('generated_text', str(result))
                          else:
                              answer = str(result)
                          break
                  except urllib.error.HTTPError as e:
                      if e.code == 503 and attempt < 2:
                          print(f'[Pacing] Modell lädt noch auf den HF-Servern (503). Warte 10 Sekunden (Versuch {attempt+1}/3)...')
                          time.sleep(10) # Kontrollierte Pause
                          continue
                      raise e

          except Exception as e:
              status = 'FEHLER'
              answer = str(e)
              print(f'Fehler aufgetreten: {e}')

          # --- TRACKING: Gesamtdauer berechnen ---
          duration = round(time.time() - start_time, 2)
          print(f'[Tracking] Ausführung beendet. Status: {status} | Dauer: {duration}s')

          # Benachrichtigung mit Tracking-Daten ans Handy senden
          notif_text = f'🤖 JARVIS [{status}] ({duration}s)\nAntwort: {answer[:120]}...'.encode('utf-8')
          urllib.request.urlopen(f'https://ntfy.sh/{topic}', data=notif_text)
          "

      - name: Änderungen committen & pushen
        run: |
          git config --global user.name 'JARVIS Cloud Agent'
          git config --global user.email 'agent@jarvis.local'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 [Tracked Agent] Ausführung beendet' && git push)
