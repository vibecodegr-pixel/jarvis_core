name: JARVIS Cloud Agent (HF API & Dynamic)

concurrency:
  group: jarvis-memory-lock
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Befehl für JARVIS'
        required: true
        default: 'System-Check'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests

      - name: JARVIS über Hugging Face API ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          python -c "
          import os
          import time
          import json
          from huggingface_hub import InferenceClient

          start_time = time.time()
          token = os.environ.get('HF_TOKEN')
          command = os.environ.get('USER_COMMAND', 'System-Check')

          print(f'[Tracking] Starte HF-Inferenz für: {command}')
          
          # 1. Quota laden & prüfen
          quota_file = 'quota.json'
          quota_data = {'cloud_runs': 0, 'total_tokens': 0}
          if os.path.exists(quota_file):
              try:
                  with open(quota_file, 'r', encoding='utf-8') as f:
                      quota_data = json.load(f)
              except:
                  pass

          quota_data['cloud_runs'] = quota_data.get('cloud_runs', 0) + 1

          # 2. Gedächtnis laden
          memory_file = 'memory.json'
          history = []
          if os.path.exists(memory_file):
              try:
                  with open(memory_file, 'r', encoding='utf-8') as f:
                      history = json.load(f)
              except:
                  history = []

          context_str = ''
          if history:
              context_str = '\n\nBisheriges Gedächtnis (letzte Aktionen):\n' + '\n'.join(
                  [f'- User: {item[\"cmd\"]} | JARVIS: {item[\"ans\"][:100]}' for item in history[-5:]]
              )

          status = 'ERFOLG'
          answer = ''
          diff_data = ''

          try:
              client = InferenceClient(
                  model='Qwen/Qwen2.5-7B-Instruct',
                  token=token
              )
              
              system_prompt = (
                  'Du bist JARVIS, ein autonomer Software-Agent mit Langzeitgedächtnis. '
                  'Führe den Befehl des Benutzers aus. '
                  'Antworte AUSSCHLIESSLICH im folgenden JSON-Format ohne Markdown-Wrapper:\n'
                  '{\n  \"ans\": \"Kurze, natürliche Antwort für den Chat\",\n'
                  '  \"diff\": \"Hier genaue Code-Änderungen oder betroffenen Dateien im Diff-Format auflisten, falls Code geändert wird. Leer lassen, wenn keine Code-Änderung nötig ist.\"\n'
                  f'}}{context_str}'
              )

              response = client.chat.completions.create(
                  messages=[
                      {'role': 'system', 'content': system_prompt},
                      {'role': 'user', 'content': command}
                  ],
                  max_tokens=600
              )
              raw_content = response.choices[0].message.content.strip()
              
              # JSON Bereinigung falls Markdown-Wrapper vorhanden sind
              clean_content = raw_content
              if clean_content.startswith('```json'):
                  clean_content = clean_content[7:]
              if clean_content.startswith('```'):
                  clean_content = clean_content[3:]
              if clean_content.endswith('```'):
                  clean_content = clean_content[:-3]
              clean_content = clean_content.strip()

              try:
                  parsed = json.loads(clean_content)
                  answer = parsed.get('ans', raw_content)
                  diff_data = parsed.get('diff', '')
              except Exception as json_err:
                  answer = raw_content
                  diff_data = ''

              # Token-Verbrauch grob schätzen und addieren
              used_tokens = len(command.split()) + len(answer.split())
              quota_data['total_tokens'] = quota_data.get('total_tokens', 0) + used_tokens

              # Gedächtnis aktualisieren (inklusive Diff für die UI-Bestätigung)
              history.append({'cmd': command, 'ans': answer, 'diff': diff_data})
              history = history[-15:]
              with open(memory_file, 'w', encoding='utf-8') as f:
                  json.dump(history, f, ensure_ascii=False, indent=2)

              # Quota aktualisieren
              with open(quota_file, 'w', encoding='utf-8') as f:
                  json.dump(quota_data, f, ensure_ascii=False, indent=2)

          except Exception as e:
              status = 'FEHLER'
              answer = str(e)
              diff_data = ''
              print(f'Fehler aufgetreten: {e}')

          duration = round(time.time() - start_time, 2)
          print(f'[Tracking] Beendet. Status: {status} | Dauer: {duration}s')

          # Kurze, knackige Push-Nachricht im coolen Vibe für das Handy
          notif_text = f'🤖 JARVIS [{status}] • Lauf #{quota_data[\"cloud_runs\"]} ({duration}s)\n{answer[:100]}'
          with open('/tmp/jarvis_notif.txt', 'w', encoding='utf-8') as f:
              f.write(notif_text)
          "

      - name: Änderungen committen & pushen
        run: |
          git config --global user.name 'JARVIS Cloud Agent'
          git config --global user.email 'agent@jarvis.local'
          git add memory.json quota.json
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 [HF Agent] Gedächtnis & Quota mit Diff aktualisiert' && git push)

      - name: Benachrichtigung senden (nach Git-Push)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TOPIC="${NTFY_TOPIC:-jarvis-status-GR-998877}"
          curl -s -X POST "[https://ntfy.sh/$TOPIC](https://ntfy.sh/$TOPIC)" --data-binary "@/tmp/jarvis_notif.txt"
