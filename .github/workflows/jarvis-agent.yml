name: JARVIS Cloud Agent (Hermes)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Befehl für JARVIS'
        required: true
        default: 'System-Check'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Ollama installieren, starten und Hermes ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          echo "Installiere Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh

          echo "Starte Ollama Server im Hintergrund..."
          ollama serve &
          sleep 5

          echo "Lade Hermes Modell..."
          ollama pull hermes3

          echo "Führe Befehl aus: $USER_COMMAND"
          RESPONSE=$(ollama run hermes3 "Du bist JARVIS. Führe folgenden Befehl aus: $USER_COMMAND")
          echo "Antwort: $RESPONSE"

          # Benachrichtigung via ntfy.sh ans Handy senden
          python -c "
          import urllib.request, os
          topic = os.environ.get('NTFY_TOPIC', 'jarvis-status-GR-998877')
          text = '''🤖 Hermes-Agent fertig: $USER_COMMAND'''
          req = urllib.request.Request(f'https://ntfy.sh/{topic}', data=text.encode('utf-8'), method='POST')
          urllib.request.urlopen(req)
          "

      - name: Änderungen committen & pushen
        run: |
          git config --global user.name 'JARVIS Cloud Agent'
          git config --global user.email 'agent@jarvis.local'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 [Hermes Agent] Automatische Ausführung' && git push)
