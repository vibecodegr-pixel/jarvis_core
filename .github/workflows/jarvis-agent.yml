name: JARVIS Autonomous Cloud Agent

on:
  repository_dispatch:
    types: [jarvis-task, jarvis-confirm-diff]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Manuelle Eingabe für JARVIS'
        required: false
        default: 'System Check'

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Python Setup & Abhängigkeiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: 3. JARVIS Core Engine ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISPATCH_PROMPT: ${{ github.event.client_payload.prompt }}
          MANUAL_PROMPT: ${{ github.event.inputs.prompt }}
        run: python agent.py

      - name: 4. Git Commit & Push (Voller State & Skill Sync)
        if: always()
        run: |
          git config --global user.name "JARVIS Cloud Agent"
          git config --global user.email "jarvis@autonomous.local"
          git add memory.json instructions.md *.py || true
          git commit -m "feat(jarvis): autonomous state, skill & memory update [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || true

      - name: 5. Push-Benachrichtigung (ntfy.sh)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            if [ "$JOB_STATUS" = "success" ]; then
              msg="JARVIS Lauf erfolgreich abgeschlossen"
            else
              msg="JARVIS Lauf mit Status: $JOB_STATUS beendet"
            fi
            curl -s -d "$msg" "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
