name: JARVIS Cloud Agent (HF API & Dynamic)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Befehl für JARVIS'
        required: true
        default: 'System-Check'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    # HIER IST DIE LÖSUNG: Erlaubt JARVIS das Speichern im Repo
    permissions:
      contents: write
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests

      - name: JARVIS über Hugging Face API ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          python -c "
          import os
          import time
          import json
          from huggingface_hub import InferenceClient
          import requests

          start_time = time.time()
          token = os.environ.get('HF_TOKEN')
          command = os.environ.get('USER_COMMAND', 'System-Check')
          topic = os.environ.get('NTFY_TOPIC', 'jarvis-status-GR-998877')

          print(f'[Tracking] Starte HF-Inferenz für: {command}')
          
          memory_file = 'memory.json'
          history = []
          if os.path.exists(memory_file):
              try:
                  with open(memory_file, 'r', encoding='utf-8') as f:
                      history = json.load(f)
              except Exception as e:
                  print(f'[Gedächtnis] Konnte memory.json nicht lesen: {e}')
                  history = []

          context_str = ''
          if history:
              context_str = '\n\nBisheriges Gedächtnis (letzte Aktionen):\n' + '\n'.join(
                  [f'- User: {item[\"cmd\"]} | JARVIS: {item[\"ans\"][:100]}' for item in history[-5:]]
              )

          status = 'ERFOLG'
          answer = ''

          try:
              client = InferenceClient(
                  model='Qwen/Qwen2.5-7B-Instruct',
                  token=token
              )
              
              system_prompt = f'Du bist JARVIS, ein autonomer Software-Agent mit Langzeitgedächtnis. Führe folgenden Befehl aus und antworte präzise und kurz.{context_str}'

              response = client.chat.completions.create(
                  messages=[
                      {'role': 'system', 'content': system_prompt},
                      {'role': 'user', 'content': command}
                  ],
                  max_tokens=400
              )
              answer = response.choices[0].message.content

              history.append({'cmd': command, 'ans': answer})
              history = history[-15:]
              with open(memory_file, 'w', encoding='utf-8') as f:
                  json.dump(history, f, ensure_ascii=False, indent=2)

          except Exception as e:
              status = 'FEHLER'
              answer = str(e)
              print(f'Fehler aufgetreten: {e}')

          duration = round(time.time() - start_time, 2)
          print(f'[Tracking] Beendet. Status: {status} | Dauer: {duration}s')

          notif_text = f'🤖 JARVIS [{status}] ({duration}s)\nBefehl: {command}\nAntwort: {answer[:150]}...'
          requests.post(f'https://ntfy.sh/{topic}', data=notif_text.encode('utf-8'))
          "

      - name: Änderungen committen & pushen
        run: |
          git config --global user.name 'JARVIS Cloud Agent'
          git config --global user.email 'agent@jarvis.local'
          git add memory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 [HF Agent] Gedächtnis aktualisiert' && git push)
