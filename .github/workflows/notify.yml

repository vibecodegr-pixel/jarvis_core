name: Notify on Deployment Success

on:
  deployment_status:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success'
    steps:
      - name: Send ntfy Push Notification
        run: |
          curl -d "🚀 JARVIS Update komplett fertig & online!" ntfy.sh/jarvis-status-GR-998877
